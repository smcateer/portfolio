<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Data science portfolio — Stephen McAteer">
      <span class="brand-portfolio">Data science portfolio</span>
      <span class="brand-person">Stephen McAteer</span>
    </a>
    <nav class="header-actions" aria-label="Site controls">
      <button class="header-search" type="button" id="search-toggle" aria-expanded="false" aria-controls="site-search">Search</button>
      <div class="theme-picker">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" aria-label="Colour scheme: Light">
          <span id="theme-toggle-label">Light</span>
          <span class="theme-caret" aria-hidden="true">⌄</span>
        </button>
        <div id="theme-menu" class="theme-menu" role="menu" aria-label="Colour scheme" hidden>
          <button type="button" class="theme-option" role="menuitemradio" aria-checked="true" data-theme-choice="light">Light</button>
          <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="system">System</button>
          <button type="button" class="theme-option" role="menuitemradio" aria-checked="false" data-theme-choice="dark">Dark</button>
        </div>
      </div>
    </nav>
  </div>
</header>
