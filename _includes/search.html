<section id="site-search" class="search-panel" hidden aria-label="Search the portfolio" data-index-url="{{ '/search.json' | relative_url }}">
  <div class="search-inner" role="search">
    <label for="search-query" class="search-label">Search the portfolio</label>
    <input id="search-query" type="search" autocomplete="off" spellcheck="false" placeholder="Enter a title or keyword">
    <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
    <ul class="search-results" id="search-results"></ul>
  </div>
</section>
