title: "Data science portfolio - Stephen McAteer"
description: "Data science, public-sector audit, mathematical physics, and other projects."
url: "https://smcateer.github.io"
baseurl: "/portfolio"
favicon: "/assets/images/sm_favicon_circle.ico"

# This is an independent Jekyll theme. GitHub Pages builds from master;
# the refactor/minimal-jekyll branch is intended for isolated previews.
markdown: kramdown
permalink: /:categories/:title/
paginate: 5
paginate_path: "/page:num/"
timezone: Australia/Melbourne

include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

plugins:
  - jekyll-paginate
  - jekyll-sitemap

author:
  name: "Stephen McAteer"
  avatar: "/assets/images/bio-photo.webp"
  bio: |
    My name is Stephen McAteer, I'm the father of two and the husband of one.

    I currently lead the Performance Audit Data Science team at the Victorian Auditor-General’s Office. I have a PhD in mathematical physics, and have worked with data across the defence, telecommunications and postal service sectors. I am a long-suffering Bombers supporter.

    This blog is a showcase of data science work by me and teams I’ve led … and a bunch of other random stuff that interests me besides.
  links:
    - label: LinkedIn
      url: "https://www.linkedin.com/in/smcateer/"
    - label: GitHub
      url: "https://github.com/smcateer"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
